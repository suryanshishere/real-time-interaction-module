name: Deploy to Cloudflare

# Auto-deploy PollBuzz to Cloudflare Workers on every push to main.
# Requires one GitHub repo secret: CLOUDFLARE_API_TOKEN
# (create it at Cloudflare > My Profile > API Tokens > "Edit Cloudflare Workers" template).

on:
  push:
    branches: [main]
  workflow_dispatch: {} # allows manual "Run workflow" from the Actions tab

concurrency:
  group: deploy-cloudflare
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      # Runs `tsc --noEmit && vite build` then
      # `wrangler deploy --config dist/pollbuzz/wrangler.json`
      - run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: dde2a53b8bb4d3259e14ee30b7c560e2
