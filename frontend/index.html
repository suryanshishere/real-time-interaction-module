      content="live polls, real time polling, online poll maker, free poll tool, audience polling, classroom polls, meeting polls, instant polls, vote online"

    <meta name="twitter:title" content="PollBuzz — Create & Share Live Polls in Real Time" />

      name="twitter:description"
      content="Create a poll, share a code, and watch live results update instantly. Free real-time polling for classrooms, teams, and events."

            "@id": "https://pollbuzz.suryansh.lol/#website",

            "description": "PollBuzz is a free real-time polling tool. Create a poll, share a code, and watch live results update instantly.",

              "price": "0",
              "priceCurrency": "USD"
            }
          }
        ]
      }
